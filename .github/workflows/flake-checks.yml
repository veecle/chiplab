name: flake check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# Cancel jobs for previous commits in the same branch.
# On main and in the merge queue `head_ref` is not available and `run_id` is always unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  matrix-checks:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877  # v32.1.0

      # `keep-going` reports every failing check in one run, rather than stopping at the first.
      - name: nix flake check
        run: nix flake check --print-build-logs --option keep-going true
