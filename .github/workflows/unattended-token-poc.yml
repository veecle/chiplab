name: Unattended Token POC

on:
  push:
    branches: [forria/unattended-token-poc]
  workflow_dispatch:

# Proves that a veecle_pat_* token stored as a GitHub Actions secret can:
# 1. Authenticate against the Chiplab MCP server from CI (no browser, no OAuth)
# 2. Call MCP tools (upload a built ELF, run a simulation, read back UART output)
# 3. Serve as a smoke test that the full upload -> run -> read loop works unattended

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # ------------------------------------------------------------------
      # Step 1: Build the stm32f4-discovery bare-metal example
      # ------------------------------------------------------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7m-none-eabi

      - name: Build hello-stm32f4-discovery
        working-directory: examples/bare-metal/stm32f4-discovery
        run: cargo build --release

      - name: Verify ELF exists
        run: |
          ELF="examples/bare-metal/stm32f4-discovery/target/thumbv7m-none-eabi/release/hello-stm32f4-discovery"
          if [ ! -f "$ELF" ]; then
            echo "::error::ELF not found at $ELF"
            exit 1
          fi
          echo "ELF_PATH=$ELF" >> "$GITHUB_ENV"
          echo "ELF_SIZE=$(stat -c%s "$ELF")" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------
      # Step 2: Initialize MCP session and capture the session ID
      # ------------------------------------------------------------------
      # Standard MCP HTTP transport: the server returns Mcp-Session-Id in
      # the initialize response headers. Every subsequent request must echo
      # it back. We capture it from the response headers and store it as a
      # step output.
      - name: Initialize MCP connection
        env:
          CHIPLAB_MCP_URL: https://chiplab.veecle.ai/mcp
          CHIPLAB_API_KEY: ${{ secrets.CHIPLAB_API_KEY }}
        id: init
        run: |
          set -e

          # Write response headers to a temp file so we can extract Mcp-Session-Id.
          HEADERS_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS \
            -o /tmp/init-body.txt \
            -D "$HEADERS_FILE" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CHIPLAB_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","method":"initialize","id":1,"params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"github-actions-ci","version":"1.0.0"}}}' \
            "${CHIPLAB_MCP_URL}")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Initialize failed with HTTP $HTTP_CODE"
            echo "Response headers:"
            cat "$HEADERS_FILE"
            echo "Response body:"
            cat /tmp/init-body.txt
            exit 1
          fi

          # Strip SSE data: prefix for JSON parsing.
          BODY=$(sed -n 's/^data: //p' /tmp/init-body.txt)

          echo "Initialize response:"
          echo "$BODY" | jq .

          ERROR_CODE=$(echo "$BODY" | jq -r '.error.code // "none"')
          if [ "$ERROR_CODE" != "none" ]; then
            ERROR_MSG=$(echo "$BODY" | jq -r '.error.message // "unknown"')
            echo "::error::Initialize returned error: $ERROR_MSG (code: $ERROR_CODE)"
            exit 1
          fi

          # Extract the session ID from the response headers (case-insensitive).
          MCP_SESSION_ID=$(grep -i '^mcp-session-id:' "$HEADERS_FILE" | head -1 | sed 's/^[^:]*: *//' | tr -d '\r')
          if [ -z "$MCP_SESSION_ID" ]; then
            echo "::error::Initialize response missing Mcp-Session-Id header"
            echo "Response headers:"
            cat "$HEADERS_FILE"
            exit 1
          fi

          echo "mcp_session_id=$MCP_SESSION_ID" >> "$GITHUB_OUTPUT"
          echo "::notice::MCP session initialized, session_id=$MCP_SESSION_ID"

      # ------------------------------------------------------------------
      # Step 3: Get an upload ticket
      # ------------------------------------------------------------------
      - name: Issue upload ticket
        env:
          CHIPLAB_MCP_URL: https://chiplab.veecle.ai/mcp
          CHIPLAB_API_KEY: ${{ secrets.CHIPLAB_API_KEY }}
          MCP_SESSION_ID: ${{ steps.init.outputs.mcp_session_id }}
        id: upload_ticket
        run: |
          set -e

          BODY_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CHIPLAB_API_KEY}" \
            -H "Mcp-Session-Id: ${MCP_SESSION_ID}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","method":"tools/call","id":2,"params":{"name":"issue_upload_ticket","arguments":{}}}' \
            "${CHIPLAB_MCP_URL}")

          echo "HTTP status: $HTTP_CODE"

          BODY=$(sed -n 's/^data: //p' "$BODY_FILE")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Upload ticket request failed with HTTP $HTTP_CODE"
            echo "Response body:"
            cat "$BODY_FILE"
            exit 1
          fi

          echo "Upload ticket response:"
          echo "$BODY" | jq .

          ERROR_CODE=$(echo "$BODY" | jq -r '.error.code // "none"')
          if [ "$ERROR_CODE" != "none" ]; then
            ERROR_MSG=$(echo "$BODY" | jq -r '.error.message // "unknown"')
            echo "::error::Upload ticket call returned error: $ERROR_MSG (code: $ERROR_CODE)"
            exit 1
          fi

          # The tool returns its result as JSON inside content[0].text.
          TOOL_CONTENT=$(echo "$BODY" | jq -r '.result.content[0].text // empty')
          if [ -z "$TOOL_CONTENT" ]; then
            echo "::error::No content in tool response"
            exit 1
          fi

          ARTIFACT_ID=$(echo "$TOOL_CONTENT" | jq -r '.artifact_id // empty')
          UPLOAD_URL=$(echo "$TOOL_CONTENT" | jq -r '.upload_url // empty')

          if [ -z "$ARTIFACT_ID" ] || [ -z "$UPLOAD_URL" ]; then
            echo "::error::Missing artifact_id or upload_url in ticket response"
            exit 1
          fi

          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

          echo "::notice::Upload ticket issued, artifact_id=$ARTIFACT_ID"

      # ------------------------------------------------------------------
      # Step 4: Upload the ELF
      # ------------------------------------------------------------------
      - name: Upload ELF to presigned URL
        run: |
          echo "Uploading ${{ env.ELF_PATH }} (${{ env.ELF_SIZE }} bytes)"
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            --upload-file "${{ env.ELF_PATH }}" \
            "${{ steps.upload_ticket.outputs.upload_url }}")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Upload failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "::notice::ELF uploaded successfully"

      # ------------------------------------------------------------------
      # Step 5: Run the simulation (async task, poll for completion)
      # ------------------------------------------------------------------
      # The `run` tool is async (TaskSupport::Optional). Since our client
      # doesn't declare task support, the server enqueues the work and
      # returns a task_id + status. We poll get_task_info until the task
      # completes, then fetch the result with get_task_result.
      - name: Run on stm32f4_discovery
        env:
          CHIPLAB_MCP_URL: https://chiplab.veecle.ai/mcp
          CHIPLAB_API_KEY: ${{ secrets.CHIPLAB_API_KEY }}
          MCP_SESSION_ID: ${{ steps.init.outputs.mcp_session_id }}
        id: run
        run: |
          set -e

          BODY_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CHIPLAB_API_KEY}" \
            -H "Mcp-Session-Id: ${MCP_SESSION_ID}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"tools/call\",\"id\":3,\"params\":{\"name\":\"run\",\"arguments\":{\"artifact_id\":\"${{ steps.upload_ticket.outputs.artifact_id }}\",\"board_id\":\"stm32f4_discovery\"}}}" \
            "${CHIPLAB_MCP_URL}")

          echo "HTTP status: $HTTP_CODE"

          BODY=$(sed -n 's/^data: //p' "$BODY_FILE")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Run request failed with HTTP $HTTP_CODE"
            echo "Response body:"
            cat "$BODY_FILE"
            exit 1
          fi

          echo "Run response:"
          echo "$BODY" | jq .

          ERROR_CODE=$(echo "$BODY" | jq -r '.error.code // "none"')
          if [ "$ERROR_CODE" != "none" ]; then
            echo "::error::Simulation run call returned error"
            exit 1
          fi

          # The `run` tool returns a task when the client doesn't support
          # async tasks natively. Extract task_id and current status.
          TASK_ID=$(echo "$BODY" | jq -r '.result.structuredContent.task_id // empty')
          if [ -z "$TASK_ID" ]; then
            echo "::error::No task_id in run response"
            exit 1
          fi

          LAST_STATUS=$(echo "$BODY" | jq -r '.result.structuredContent.status // "working"')
          echo "Task $TASK_ID started, initial status: $LAST_STATUS"

          # Poll get_task_info until the task completes. Each call blocks
          # until the status changes from last_status, capped at 2 minutes.
          echo "Waiting for task to complete..."
          ELAPSED=0
          MAX_WAIT=300
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            HTTP_CODE=$(curl -sS \
              -o "$BODY_FILE" \
              -w "%{http_code}" \
              -H "Authorization: Bearer ${CHIPLAB_API_KEY}" \
              -H "Mcp-Session-Id: ${MCP_SESSION_ID}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -d "{\"jsonrpc\":\"2.0\",\"method\":\"tools/call\",\"id\":50,\"params\":{\"name\":\"get_task_info\",\"arguments\":{\"task_id\":\"$TASK_ID\",\"last_status\":\"$LAST_STATUS\",\"timeout\":30}}}" \
              "${CHIPLAB_MCP_URL}")

            BODY=$(sed -n 's/^data: //p' "$BODY_FILE")

            TIMED_OUT=$(echo "$BODY" | jq -r '.result.structuredContent.timed_out // false')
            NEW_STATUS=$(echo "$BODY" | jq -r '.result.structuredContent.task.status // empty')

            if [ "$NEW_STATUS" = "completed" ] || [ "$NEW_STATUS" = "failed" ] || [ "$NEW_STATUS" = "cancelled" ]; then
              echo "Task completed with status: $NEW_STATUS"
              break
            fi

            if [ "$TIMED_OUT" = "true" ]; then
              echo "Polling timed out, retrying..."
            fi

            LAST_STATUS="$NEW_STATUS"
            ELAPSED=$((ELAPSED + 30))
            echo "Still waiting... (${ELAPSED}s elapsed, status: $NEW_STATUS)"
          done

          if [ "$NEW_STATUS" != "completed" ]; then
            echo "::error::Task did not complete within ${MAX_WAIT}s (final status: $NEW_STATUS)"
            exit 1
          fi

          # Fetch the final result.
          HTTP_CODE=$(curl -sS \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CHIPLAB_API_KEY}" \
            -H "Mcp-Session-Id: ${MCP_SESSION_ID}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"tools/call\",\"id\":51,\"params\":{\"name\":\"get_task_result\",\"arguments\":{\"task_id\":\"$TASK_ID\"}}}" \
            "${CHIPLAB_MCP_URL}")

          BODY=$(sed -n 's/^data: //p' "$BODY_FILE")
          echo "Task result:"
          echo "$BODY" | jq .

          TOOL_CONTENT=$(echo "$BODY" | jq -r '.result.content[0].text // empty')
          if [ -z "$TOOL_CONTENT" ]; then
            echo "::error::No content in task result"
            exit 1
          fi

          RUN_ID=$(echo "$TOOL_CONTENT" | jq -r '.run_id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::error::Missing run_id in task result"
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          ARTIFACTS=$(echo "$TOOL_CONTENT" | jq -r '.artifacts[] // empty')
          echo "Run $RUN_ID produced artifacts: $ARTIFACTS"
          echo "::notice::Simulation completed, run_id=$RUN_ID"

      # ------------------------------------------------------------------
      # Step 6: Get download URL for the UART output
      # ------------------------------------------------------------------
      - name: Download UART output
        env:
          CHIPLAB_MCP_URL: https://chiplab.veecle.ai/mcp
          CHIPLAB_API_KEY: ${{ secrets.CHIPLAB_API_KEY }}
          MCP_SESSION_ID: ${{ steps.init.outputs.mcp_session_id }}
        run: |
          set -e

          # List artifacts for this run.
          BODY_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CHIPLAB_API_KEY}" \
            -H "Mcp-Session-Id: ${MCP_SESSION_ID}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"tools/call\",\"id\":4,\"params\":{\"name\":\"list_run_artifacts\",\"arguments\":{\"run_id\":\"${{ steps.run.outputs.run_id }}\"}}}" \
            "${CHIPLAB_MCP_URL}")

          BODY=$(sed -n 's/^data: //p' "$BODY_FILE")
          echo "List artifacts response:"
          echo "$BODY" | jq .

          TOOL_CONTENT=$(echo "$BODY" | jq -r '.result.content[0].text // empty')
          if [ -z "$TOOL_CONTENT" ]; then
            echo "::error::No content in list_run_artifacts response"
            exit 1
          fi

          # The response is a JSON array of artifact names. Pick the first one
          # (typically uart output).
          UART_ARTIFACT=$(echo "$TOOL_CONTENT" | jq -r '.[0] // empty')
          if [ -z "$UART_ARTIFACT" ]; then
            echo "::error::No artifacts found for run"
            exit 1
          fi

          echo "Found artifact: $UART_ARTIFACT"

          # Get a presigned download URL for the artifact.
          HTTP_CODE=$(curl -sS \
            -o "$BODY_FILE" \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${CHIPLAB_API_KEY}" \
            -H "Mcp-Session-Id: ${MCP_SESSION_ID}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"tools/call\",\"id\":5,\"params\":{\"name\":\"issue_download_ticket\",\"arguments\":{\"run_id\":\"${{ steps.run.outputs.run_id }}\",\"artifact_name\":\"$UART_ARTIFACT\"}}}" \
            "${CHIPLAB_MCP_URL}")

          BODY=$(sed -n 's/^data: //p' "$BODY_FILE")
          echo "Download ticket response:"
          echo "$BODY" | jq .

          TOOL_CONTENT=$(echo "$BODY" | jq -r '.result.content[0].text // empty')
          DOWNLOAD_URL=$(echo "$TOOL_CONTENT" | jq -r '.download_url // empty')

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::No download_url in ticket response"
            exit 1
          fi

          # Download and verify the UART output.
          UART_OUTPUT=$(curl -sS --fail "$DOWNLOAD_URL")
          echo "=== UART Output ==="
          echo "$UART_OUTPUT"
          echo "==================="

          if ! echo "$UART_OUTPUT" | grep -q "Hello world!"; then
            echo "::error::Expected 'Hello world!' in UART output but not found"
            exit 1
          fi

          echo "::notice::UART output verified: Hello world! found"

      # ------------------------------------------------------------------
      # Step 7: Summary
      # ------------------------------------------------------------------
      - name: Report
        if: always()
        run: |
          echo "### Chiplab Unattended Token POC - ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Token auth | :white_check_mark: |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build ELF | :white_check_mark: |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Upload ELF | :white_check_mark: |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Simulate on stm32f4-discovery | :white_check_mark: |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Verify 'Hello world!' output | :white_check_mark: |" >> "$GITHUB_STEP_SUMMARY"
